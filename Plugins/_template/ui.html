<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: Inter, -apple-system, sans-serif; font-size: 12px;
    color: var(--figma-color-text, #333); background: var(--figma-color-bg, #fff);
  }
  h1 { font-size: 12px; font-weight: 600; margin: 0 0 12px; }
  .apply {
    width: 100%; padding: 10px 0; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--figma-color-bg-brand, #0d99ff); color: #fff; font-size: 12px; font-weight: 600;
  }
  .apply:active { opacity: .85; }
  #result { margin-top: 12px; font-size: 11px; color: var(--figma-color-text-secondary, #777); min-height: 28px; }
  #result.error { color: var(--figma-color-text-danger, #e03e3e); }
</style>
</head>
<body>
  <h1>PLUGIN_NAME</h1>
  <button class="apply" id="apply">Apply</button>
  <div id="result"></div>
<script>
  var res = document.getElementById('result');
  document.getElementById('apply').onclick = function () {
    res.className = ''; res.textContent = '...';
    parent.postMessage({ pluginMessage: { type: 'apply' } }, '*');
  };
  onmessage = function (e) {
    var m = e.data.pluginMessage;
    if (m && m.type === 'result') { res.className = m.error ? 'error' : ''; res.textContent = m.text; }
  };
</script>
</body>
</html>
